<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{%static 'img/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{%static 'img/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{%static 'img/favicon-16x16.png' %}">
    <link rel="manifest" href="{%static 'img/site.webmanifest' %}">
    <link rel="mask-icon" href="{%static 'img/safari-pinned-tab.svg' %}" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@700&display=swap" rel="stylesheet">
    <script src="{%static 'js/script.js' %}"> </script>
</head>

<body>
    <header>
        <nav id="navbar">
            <div id="logo">
                <img src="{% static 'img/images.jpg' %}" alt="Wings Institute">
            </div>
            <div class="icon" onclick="menu(this)">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </div>

        </nav>
        <ul id="links">
            <li><a href="../">Home</a></li>
            <li><a href="#">Login</a></li>
            <li><a href="../register">Register</a></li>
            <li><a href="#">About us</a></li>
            <li><a href="../contact">Contact us</a></li>
        </ul>

    </header>

    <div class="form-container">
        <div class="form">
            
            <div class="login-img"></div>

            <form name="loginForm" method="post" class="medium-form">
                {% csrf_token %}
                <h1 class="big-font big-size bottom-margin">Login</h1>
                <div>{{msg}}</div>
                <input type="text" name="login_id" placeholder="Username or Email" class="line-width" required>
                <input type="password" name="login_pass" placeholder="Password" class="line-width" required>
                <div class="login-check bottom-margin">
                    <input type="checkbox" class="chk-line-width">
                    <label for="" class="chk-text">Remember me</label>
                </div>
            
                <div>
                    <button class="medium-btn">Login</button>
                </div>
                <div class="forgot-pass">
                    <a href="#">Forgot password? </a>
                </div>
            </form>

        </div>
    </div>
    </div>
    </form>
    <footer>
        <p>All rights reserved.</p>
        <div class="connect">
            <p>Connect us on : </p>
            <a href="https://www.facebook.com/Wingsinstitute2011/" target="_blank"><img
                    src="{%static 'img/facebook.png' %}" alt="facebook"></a>
            <a href="https://www.youtube.com/channel/UCEYfXyAjqRok8N_cbE-Kzrg"><img src="{%static 'img/youtube.png' %}"
                    alt="youtube"></a>
            <a href="https://play.google.com/store/apps/details?id=co.thanos.olkdr&hl=en"><img
                    src="{%static 'img/google_play.png' %}" alt="App"></a>
            <a href="http://t.me/wingsInstitutegm"><img src="{%static 'img/telegram.png' %}" alt="telegram"></a>
        </div>
    </footer>


</body>

</html>
