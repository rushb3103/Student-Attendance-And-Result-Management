<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome To Wings Institute !!</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{%static 'img/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{%static 'img/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{%static 'img/favicon-16x16.png' %}">
    <link rel="manifest" href="{%static 'img/site.webmanifest' %}">
    <link rel="mask-icon" href="{%static 'img/safari-pinned-tab.svg' %}" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
    <script src="{%static 'js/script.js' %}">
    </script>

</head>

<body>
    <header>
        <nav id="navbar">
            <div id="logo">
                <img src="{% static 'img/images.jpg' %}" alt="Wings Institute">
            </div>
            <div class="icon" onclick="menu(this)">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </div>

        </nav>

        <ul id="links">
            <li><a href="../">Home</a></li>
            <li><a href="../login">Login</a></li>
            <li><a href="../register">Register</a></li>
            <li><a href="#">About us</a></li>
            <li><a href="../contact">Contact us</a></li>
        </ul>
    </header>
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong>Holy guacamole!</strong> You should check in on some of those fields below.
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="form-container">
        <div class="form ">
            <div id="Regimage"></div>
            <form name="Regform" id="Regform" class="medium-form" onsubmit="return validateregForm()" method="post">
                {% csrf_token %}
                <div class="big-font">
                    <h2>Sign up</h2>
                </div>
                <div class="pop-font">
                    <input type="text" name="name" id="Myregname" value="" placeholder="Enter Your Name..">
                    <input type="email" name="email" id="Myregemail" value="" placeholder="Enter Your Email..">
                    <input type="password" name="pass" id="Myregpass" value="" placeholder="Enter Your Password ..">
                    <input type="password" name="confpass" id="Myregconfpass" value="" placeholder="Confirm Password..">
                    <select name="type" id="Myregtype" onchange="Reguserchange(this)">
                        <option value="0">Type :</option>
                        <option value="1">Student</option>
                        <option value="2">Teacher</option>
                    </select>
                    <div class="stu">
                        <select name="class" id="Myregclass">
                            <option value="0">Select Class :</option>
                            <option value="1">9th</option>
                            <option value="2">10th</option>
                            <option value="3">11th</option>
                            <option value="4">12th</option>
                        </select>

                        <textarea name="s_add" id="Myregadd" cols="15" rows="4"
                            placeholder="Enter Address : "></textarea>
                    </div>
                    <div class="teach">
                        <input type="text" name="t_exp" id="Myregexp" value="" placeholder="Enter your Experience..">
                        <select name="t_sub" id="Myregsub">
                            <option value="0">Select Subject :</option>
                            <option value="1">Science</option>
                            <option value="2">Maths</option>
                            <option value="3">Social Science</option>
                            <option value="4">English</option>
                        </select>
                    </div>
                    <input type="text" name="phone" id="Myregphone" value="" placeholder="Enter Your Mobile Number..">
                </div>
                <div id="regalert1"></div>
                <div id="regalert2">{{ msg }}</div>
                <div class="pop-font"><button type="submit" class="medium-btn" value="Submit"
                        class="medium-btn">Submit</button>
                    <button type="reset" value="Reset" class="medium-btn" onclick="ResetregForm()">Reset</button>
                </div>
                <div class="pop-font">Already User? <a href="../login">Click Here</a></div>
            </form>
        </div>
    </div>
    <footer>
        <p>All rights reserved.</p>
        <div class="connect">
            <p>Connect us on : </p>
            <a href="https://www.facebook.com/Wingsinstitute2011/" target="_blank"><img
                    src="{%static 'img/facebook.png' %}" alt="facebook"></a>
            <a href="https://www.youtube.com/channel/UCEYfXyAjqRok8N_cbE-Kzrg"><img src="{%static 'img/youtube.png' %}"
                    alt="youtube"></a>
            <a href="https://play.google.com/store/apps/details?id=co.thanos.olkdr&hl=en"><img
                    src="{%static 'img/google_play.png' %}" alt="App"></a>
            <a href="http://t.me/wingsInstitutegm"><img src="{%static 'img/telegram.png' %}" alt="telegram"></a>
        </div>
    </footer>

</body>

</html>
