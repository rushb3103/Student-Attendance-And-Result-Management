<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome To Wings Institute !!</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{%static 'img/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{%static 'img/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{%static 'img/favicon-16x16.png' %}">
    <link rel="manifest" href="{%static 'img/site.webmanifest' %}">
    <link rel="mask-icon" href="{%static 'img/safari-pinned-tab.svg' %}" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@700&display=swap" rel="stylesheet">
    <script src="{%static 'js/script.js' %}"> </script>

</head>

<body>
    <header>
        <nav id="navbar">
            <div id="logo">
                <img src="{% static 'img/images.jpg' %}" alt="Wings Institute">
            </div>
            <div class="icon" onclick="menu(this)">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </div>

        </nav>
        <ul id="links">
            <li><a href="../">Home</a></li>
            <li><a href="../login">Login</a></li>
            <li><a href="../register">Register</a></li>
            <li><a href="#">About us</a></li>
            <li><a href="../contact">Contact us</a></li>
        </ul>

    </header>

    <div class="contactform">
        <form action="noaction.django" id="contactform">
            <div>
                <h2>Contact Us</h2>
            </div>
            <div></div>
            <input type="text" name="name" id="Myname" placeholder="Enter Name">
            <input type="email" name="email" id="Myemail" placeholder="Enter Email">
            <input type="text" name="phone" id="Myphone" placeholder="Enter Phone No.">
            <input type="text" name="sub" id="Mysub" placeholder="Enter Subject">
            <textarea name="msg" id="mymsg" class="msgtx" cols="30" rows="5" placeholder="Message"></textarea>
            <input type="submit" value="Submit">
        </form>

        <div id="contactimage">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3671.3852297894837!2d72.61741271480122!3d23.04633428494108!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e873c661db8cb%3A0x35b141184b438d9b!2sWings%20institute%20naroda%20road!5e0!3m2!1sen!2sin!4v1642918172590!5m2!1sen!2sin"
                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <footer>
        <p>All rights reserved.</p>
        <div class="connect">
            <p>Connect us on : </p>
            <a href="https://www.facebook.com/Wingsinstitute2011/" target="_blank"><img
                    src="{%static 'img/facebook.png' %}" alt="facebook"></a>
            <a href="https://www.youtube.com/channel/UCEYfXyAjqRok8N_cbE-Kzrg"><img src="{%static 'img/youtube.png' %}"
                    alt="youtube"></a>
            <a href="https://play.google.com/store/apps/details?id=co.thanos.olkdr&hl=en"><img
                    src="{%static 'img/google_play.png' %}" alt="App"></a>
            <a href="http://t.me/wingsInstitutegm"><img src="{%static 'img/telegram.png' %}" alt="telegram"></a>
        </div>
    </footer>

</body>

</html>
