{% extends 'base-teacher.html' %}
{% block title %}Upcoming Exam{% endblock %}
{% block body %}
<main class="flex-shrink-0 justify-content-center mb-5 mx-3 pt-5">
    <div class="container m-5 justify-content-center">
        <form action="" method="post">{% csrf_token %}
            <div class="row grid bg-dark text-light">
                <div class="col-3 py-3 px-3 my-2 text-center border">Date</div>
                <div class="col-3 py-3 px-3 my-2 text-center border">Subject</div>
                <div class="col-3 py-3 px-3 my-2 text-center border">Duration</div>
                <div class="col-3 py-3 px-3 my-2 text-center border">Edit</div>
            </div>
            {% for i in exams %}
            <div class="row grid">
                <div class="col-3 py-3 px-3 my-2 text-center border bg-success text-dark bg-opacity-25">{{i.ex_start}}
                </div>
                <div class="col-3 py-3 px-3 my-2 text-center border bg-success text-dark bg-opacity-25">
                    {{i.sub_id.sub_name}}</div>
                <div class="col-3 py-3 px-3 my-2 text-center border bg-success text-dark bg-opacity-25">
                    {% widthratio i.ex_duration 60 1 %} min</div>
                <div class="col-3 py-3 px-3 my-2 text-center border bg-success text-dark bg-opacity-25">
                    <input type="hidden" name="id" value="{{i.id}}">
                    <button type="submit" name="edit" class="btn btn-outline-primary px-5">Edit</button>
                </div>
            </div>
            {% endfor %}
            <div class="row grid justify-content-center">
                <div class="col-2 py-2 px-3 ">
                    <button type="button px-3 py-2" name="create" class="btn btn-outline-primary px-5">Create</button>
                </div>
            </div>
        </form>
    </div>

</main>
{% endblock %}
