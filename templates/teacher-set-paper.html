{% extends 'base-teacher.html' %}
{% block title %}Upcoming Exam{% endblock %}
{% block body %}
<div class="container justify-content-center">
    <h1>
        Create Paper
    </h1>
    <form method="post" onsubmit="return validateQuestions()">{% csrf_token %}
        {% for i in count %}
        <div class="row visible my-4 border border-secondary rounded p-3" id="q{{i}}">
            <div class="col-12 col-lg-7 me-4">
                <div class="row"><label for="q{{i}}" class="col form-label my-1">Question {{i}}</label></div>
                <div class="row">
                    <textarea name="question{{i}}" id="text{{i}}" cols="85" rows="6"
                        class="form-control my-1"></textarea>
                </div>
                <div class="row"><label for="a{{i}}" class="col my-1">Answer {{i}}</label></div>
                <div class="row">
                    <select name="opt{{i}}" id="opt{{i}}" class="col-4 form-select my-1">
                        <option value="">Select option</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
            </div>
            <div class="row col-lg-5 mt-4">
                <div class="col">
                    <input type="text" name="optA{{i}}" id="optA{{i}}" placeholder="Enter Option A"
                        class="row form-control my-2">
                    <input type="text" name="optB{{i}}" id="optB{{i}}" placeholder="Enter Option B"
                        class="row form-control my-2">
                    <input type="text" name="optC{{i}}" id="optC{{i}}" placeholder="Enter Option C"
                        class="row form-control my-2">
                    <input type="text" name="optD{{i}}" id="optD{{i}}" placeholder="Enter Option D"
                        class="row form-control my-2">
                </div>
            </div>
        </div>

        {% endfor %}
        <div class="row text-center justify-content-center mb-3">
            <div class="row">
                <div class="col">
                    <label for="start">Start time </label>
                    <input type="datetime-local" class="form-control" name="start" id="start">
                </div>
                <div class="col">
                    <label for="end">End time </label>
                    <input type="datetime-local" class="form-control" name="end" id="end">
                </div>

            </div>
            <div class="row my-2">
                <div class="col">
                    <select name="subj" id="subj" class="form-select">
                        <option value="">Select Subject</option>
                        <option value="science">Science</option>
                        <option value="english">English</option>
                        <option value="maths">Maths</option>
                        <option value="social science">Social Science</option>
                    </select>
                </div>
                <div class="col">
                    <input type="text" name="title" id="titl" placeholder="Enter Title" class="form-control">
                </div>
            </div>
            <div id="errormsg" class="col-4">
            </div>
        </div>
        <div class="row text-center justify-content-center mb-3">
            <input type="button" id="addQuestion" value="Add Question" onclick="addQue()"
                class="col-4 col-lg-3 btn btn-outline-dark mx-2 my-5">
            <input type="submit" value="Submit" class="col-4 col-lg-3 btn btn-outline-dark mx-2 my-5">
        </div>
    </form>
</div>
{% endblock %}
{% block script %}
<script>
    let count = 2;
    for (let i = 2; i <= 10; i++) {
        var q = document.getElementById("q" + i);
        q.classList.add("d-none");
    }
    function addQue() {
        if (count <= 10) {
            q = document.getElementById("q" + count);
            if (q.classList.contains("d-none")) {
                q.classList.remove("d-none");
            }
        }
        else if (count > 10) {
            var b = document.getElementById("addQuestion");
            if (b.classList.contains("d.none")) {

            }
            else {
                b.classList.add("d-none");
            }
        }
        count += 1;
    }

    function validateQuestions() {
        var i = 1;
        for (i = 1; i <= 10; i++) {
            var q = document.getElementById("q" + i);
            var subj = document.getElementById("subj").value;
            var titl = document.getElementById("titl").value;
            var st = document.getElementById("start").value;
            var ed = document.getElementById("end").value;
            if (q.classList.contains("d-none")) {

            }
            else {
                var t = document.getElementById("text" + i).value;
                var o = document.getElementById("opt" + i).value;
                var A = document.getElementById("optA" + i).value;
                var B = document.getElementById("optB" + i).value;
                var C = document.getElementById("optC" + i).value;
                var D = document.getElementById("optD" + i).value;
                if ((t == "") || (o == "") || (A == "") || (B == "") || (C == "") || (D == "")) {
                    document.getElementById("errormsg").innerHTML = ("Please Complete Question " + i);
                    return false;
                }
                else if (st == "" || ed == "") {
                    document.getElementById("errormsg").innerHTML = ("Please select both time. ");
                    return false;
                }
                else if (subj == "" || titl == "") {
                    document.getElementById("errormsg").innerHTML = ("Please select Subject and Title. ");
                    return false;
                }
                else{
                    continue;
                }
            }
        }
    }
</script>
{% endblock %}
