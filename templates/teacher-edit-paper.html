{% extends 'base-teacher.html' %}
{% block title %}Edit paper{% endblock %}
{% block body %}
<div class="container justify-content-center">
    <h1>
        Edit Paper
    </h1>
    <form method="post" onsubmit="return validateQuestions()">{% csrf_token %}
        {% for q in list %}
        <div class="row visible my-4 border border-secondary rounded p-3" id="q{{forloop.counter}}">
            <div class="col-12 col-lg-7 me-4">
                <div class="row"><label for="q{{forloop.counter}}" class="col form-label my-1">Question {{forloop.counter}}</label></div>
                <div class="row">
                    <textarea name="question{{forloop.counter}}" id="text{{forloop.counter}}" cols="85" rows="6" placeholder="{{q.que}}"
                        class="form-control my-1"></textarea>
                </div>
                <div class="row"><label for="a{{forloop.counter}}" class="col my-1">Answer {{forloop.counter}}</label></div>
                <div class="row">
                    <select name="opt{{forloop.counter}}" id="opt{{forloop.counter}}" class="col-4 form-select my-1" aria-valuenow="{{q.ans}}">
                        <option value="">Select option</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
            </div>
            <div class="row col-lg-5 mt-4">
                <div class="col">
                    <input type="text" name="A" id="optA{{forloop.counter}}" placeholder="Enter Option A"
                        class="row form-control my-2" value="{{q.opA}}">
                    <input type="text" name="B" id="optB{{forloop.counter}}" placeholder="Enter Option B"
                        class="row form-control my-2" value="{{q.opB}}">
                    <input type="text" name="C" id="optC{{forloop.counter}}" placeholder="Enter Option C"
                        class="row form-control my-2" value="{{q.opC}}">
                    <input type="text" name="D" id="optD{{forloop.counter}}" placeholder="Enter Option D"
                        class="row form-control my-2" value="{{q.opD}}">
                </div>
            </div>
        </div>

        {% endfor %}
        <div class="row text-center justify-content-center mb-3">
            <div class="row">
                <div class="col">
                    <label for="start">Start time </label>
                    <input type="datetime-local" class="form-control" name="start" placeholder="{{e.ex_start}}" id="start">
                </div>
                <div class="col">
                    <label for="end">End time </label>
                    <input type="datetime-local" class="form-control" name="end" placeholder="{{e.ex_end}}" id="end">
                </div>

            </div>
            <div class="row my-2">
                <div class="col">
                    <select name="subj" id="subj" class="form-select" value="{{ex.sub_id.sub_name}}">
                        <option value="">Select Subject</option>
                        <option value="science">Science</option>
                        <option value="english">English</option>
                        <option value="maths">Maths</option>
                        <option value="social science">Social Science</option>
                    </select>
                </div>
                <div class="col">
                    <input type="text" name="title" id="titl" placeholder="Enter Title" class="form-control" value="{{e.ex_title}}">
                </div>
            </div>
            <div id="errormsg" class="col-4">
            </div>
        </div>
        <div class="row text-center justify-content-center mb-3">
            <input type="submit" value="Submit" class="col-4 col-lg-3 btn btn-outline-dark mx-2 my-5">
        </div>
    </form>
</div>
{% endblock %}
{% block script %}
<script>
    function validateQuestions() {
        var i = 1;
        for (i = 1; i <= 10; i++) {
            var q = document.getElementById("q" + i);
            var subj = document.getElementById("subj").value;
            var titl = document.getElementById("titl").value;
            var st = document.getElementById("start").value;
            var ed = document.getElementById("end").value;
            if (q.classList.contains("d-none")) {

            }
            else {
                var t = document.getElementById("text" + i).value;
                var o = document.getElementById("opt" + i).value;
                var A = document.getElementById("optA" + i).value;
                var B = document.getElementById("optB" + i).value;
                var C = document.getElementById("optC" + i).value;
                var D = document.getElementById("optD" + i).value;
                if ((t == "") || (o == "") || (A == "") || (B == "") || (C == "") || (D == "")) {
                    document.getElementById("errormsg").innerHTML = ("Please Complete Question " + i);
                    return false;
                }
                else if (st == "" || ed == "") {
                    document.getElementById("errormsg").innerHTML = ("Please select both time. ");
                    return false;
                }
                else if (subj == "" || titl == "") {
                    document.getElementById("errormsg").innerHTML = ("Please select Subject and Title. ");
                    return false;
                }
                else{
                    continue;
                }
            }
        }
    }
</script>
{% endblock %}
